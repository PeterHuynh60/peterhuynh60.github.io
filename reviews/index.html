<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="description" content="Peter Huynh's reviews of YouTube videos" />
    <meta name="author" content="Peter Huynh" />
    <title>Video Reviews | Peter Huynh</title>
    <link rel="icon" type="image/x-icon" href="../assets/img/favicon.ico" />
    <link href="../css/styles.css" rel="stylesheet" />
    <!-- Shared design system (fonts, colors, header, components) + theme shared with all *.huynh.place apps -->
    <link href="/shared/huynh-ui.css" rel="stylesheet" />
    <script src="/shared/huynh-ui.js"></script>
    <!-- Quill (rich-text editor for writing reviews) + DOMPurify (sanitizes formatted reviews before display) -->
    <link href="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.snow.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.4.16/dist/purify.min.js"></script>
    <!-- Shared with the main page's Video Reviews preview -->
    <link href="review-reader.css" rel="stylesheet" />
    <link href="reviews.css" rel="stylesheet" />
    <!-- PocketBase SDK: reviews live in the self-hosted PocketBase (public read, owner-only write) -->
    <script src="https://cdn.jsdelivr.net/npm/pocketbase@0.25.1/dist/pocketbase.umd.js"></script>
</head>
<body class="hu-app">
    <!-- Shared app header (same bar as B.E.T., Home Search HQ and Gym) -->
    <header class="hu-shell">
        <div class="hu-shell-inner">
            <a class="hu-home" href="/">&larr; huynh.place</a>
            <div class="hu-app-id">
                <div>
                    <h1 class="hu-app-name">Video Reviews</h1>
                    <span class="hu-app-sub">YouTube videos I've watched, rated and written up</span>
                </div>
            </div>
            <div class="hu-shell-actions">
                <button id="rv-new" class="hu-btn hu-btn-small" type="button" hidden>+ New review</button>
                <button id="rv-auth" class="hu-btn hu-btn-small" type="button">Log in</button>
                <button class="hu-theme-toggle" type="button" data-hu-theme-toggle aria-label="Toggle dark mode" title="Toggle dark mode">
                    <span class="hu-icon-light"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"/></svg></span><span class="hu-icon-dark"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg></span>
                </button>
            </div>
        </div>
    </header>

    <main class="rv-wrap">
        <div class="rv-toolbar">
            <input id="rv-search" class="rv-input" type="search" placeholder="Search titles, channels, reviews…" aria-label="Search reviews" />
            <select id="rv-sort" class="rv-input rv-select" aria-label="Sort reviews">
                <option value="newest">Newest first</option>
                <option value="rating">Highest rated</option>
                <option value="oldest">Oldest first</option>
            </select>
        </div>
        <div id="rv-tags" class="rv-tag-filter" aria-label="Filter by tag"></div>
        <p id="rv-status" class="rv-status">Loading reviews…</p>
        <div id="rv-grid" class="rv-grid"></div>
        <nav id="rv-pager" class="rv-pager" aria-label="Review pages" hidden>
            <button id="rv-prev" class="rv-btn rv-btn-small" type="button">&larr; Newer</button>
            <span id="rv-page-label"></span>
            <button id="rv-next" class="rv-btn rv-btn-small" type="button">Older &rarr;</button>
        </nav>
    </main>

    <!-- Log in -->
    <dialog id="rv-login" class="rv-dialog">
        <form id="rv-login-form" method="dialog">
            <h2>Log in</h2>
            <label>Email<input id="rv-login-email" class="rv-input" type="email" autocomplete="username" value="peter@huynh.place" required /></label>
            <label>Password<input id="rv-login-password" class="rv-input" type="password" autocomplete="current-password" required /></label>
            <p id="rv-login-error" class="rv-error" hidden></p>
            <div class="rv-dialog-actions">
                <button class="rv-btn" type="button" data-close>Cancel</button>
                <button class="rv-btn rv-btn-primary" type="submit">Log in</button>
            </div>
        </form>
    </dialog>

    <!-- Add / edit review -->
    <dialog id="rv-editor" class="rv-dialog rv-dialog-wide">
        <form id="rv-form" method="dialog">
            <h2 id="rv-form-title">New review</h2>
            <label>YouTube link<input id="rv-url" class="rv-input" type="url" placeholder="https://www.youtube.com/watch?v=…" required /></label>
            <div id="rv-preview" class="rv-preview" hidden>
                <img id="rv-preview-img" alt="" />
                <div><strong id="rv-preview-title"></strong><span id="rv-preview-channel"></span></div>
            </div>
            <div class="rv-form-row">
                <label>Title<input id="rv-title" class="rv-input" type="text" maxlength="300" required /></label>
                <label>Channel<input id="rv-channel" class="rv-input" type="text" maxlength="200" /></label>
            </div>
            <div class="rv-form-row">
                <label>Rating (0–10)<input id="rv-rating" class="rv-input" type="number" min="0" max="10" step="0.5" required /></label>
                <label>Watched on<input id="rv-watched" class="rv-input" type="date" /></label>
            </div>
            <label>Tags <small>(comma separated)</small><input id="rv-tags-input" class="rv-input" type="text" placeholder="tech, cooking, documentary" /></label>
            <div class="rv-field">
                <span class="rv-field-label">Review <small>(Tab at the start of a paragraph indents its first line; Shift+Tab undoes it)</small></span>
                <div id="rv-review-editor" class="rv-rich-editor"></div>
            </div>
            <label class="rv-check"><input id="rv-spoiler" type="checkbox" /> Contains spoilers <small>(hides the whole write-up until a reader clicks to reveal it)</small></label>
            <p id="rv-form-error" class="rv-error" hidden></p>
            <div class="rv-dialog-actions">
                <button id="rv-delete" class="rv-btn rv-btn-danger" type="button" hidden>Delete</button>
                <span class="rv-spacer"></span>
                <button class="rv-btn" type="button" data-close>Cancel</button>
                <button class="rv-btn rv-btn-primary" type="submit">Save</button>
            </div>
        </form>
    </dialog>

    <script src="review-reader.js"></script>
    <script src="reviews.js"></script>
</body>
</html>
